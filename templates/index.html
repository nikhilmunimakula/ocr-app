<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Image to clean text</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main>
    <h1>Image to clean text</h1>
    <p class="sub">Upload screenshots. Get clean, labeled text you can download as a dataset.</p>

    <div id="dropzone" tabindex="0">
      <p id="dropText">Drop images here, or click to browse (up to 20)</p>
      <input type="file" id="fileInput" accept="image/*" multiple hidden>
    </div>
    <div id="fileList"></div>

    <button id="extractBtn" disabled>Extract text</button>
    <span id="status"></span>

    <section id="results" hidden>
      <div class="bar">
        <h2>Results <small id="summary"></small></h2>
        <div>
          <button id="csvBtn">Download CSV</button>
          <button id="jsonBtn">Download JSON</button>
        </div>
      </div>
      <div id="cards"></div>
      <div id="errors"></div>
    </section>
  </main>
  <script src="/static/script.js"></script>
</body>
</html>
