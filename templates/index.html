<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Image to clean text</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main>
    <h1>Image to clean text</h1>
    <p class="sub">Upload one image. Get clean text, plus the links and junk symbols found in it.</p>

    <div id="dropzone" tabindex="0">
      <p id="dropText">Drop an image here, or click to browse</p>
      <img id="preview" alt="Selected image" hidden
           style="max-width:100%; max-height:240px; margin-top:1rem; border-radius:6px;">
      <input type="file" id="fileInput" accept="image/*" hidden>
    </div>

    <button id="extractBtn" disabled>Extract text</button>
    <span id="status"></span>

    <section id="results" hidden>
      <div id="card"></div>
    </section>
  </main>
  <script src="/static/script.js"></script>
</body>
</html>
